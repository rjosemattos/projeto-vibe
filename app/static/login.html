<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>Entrar — Prompt Sanitizer</title>
    <script src="/static/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
        <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5.1 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    </svg>
    <main class="login-wrap">
        <div class="login-card">
            <div class="brand">
                <svg class="icon icon-lg"><use href="#i-logo"/></svg>
                <span>Prompt Sanitizer</span>
            </div>
            <h1>Entrar</h1>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="username">E-mail institucional</label>
                    <input type="text" id="username" name="username" placeholder="seu.nome@cesar.school" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="120">
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="256">
                </div>
                <p id="login-error" class="form-error hidden" role="alert"></p>
                <button type="submit" id="btn-login" class="btn btn-primary">Entrar</button>
            </form>
            <p class="small muted login-note" id="login-restriction-note">Acesso exclusivo para contas <strong>@cesar.school</strong>.</p>
        </div>
    </main>
    <script src="/static/login.js"></script>
</body>
</html>

# Deploy: copy .env.example to .env, fill the secrets, set DOMAIN, then `docker compose up -d`.
# Create the first admin: docker compose exec app python manage_users.py create admin --admin
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PROMPT_SANITIZER_AUTH_ENABLED: "true"
      PROMPT_SANITIZER_ALLOWED_HOSTS: '["${DOMAIN}"]'
    volumes:
      - app-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8000"]   # reachable only through the proxy

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  app-data:
  caddy-data:
